name = "finance-v3-upload"
main = "s3-upload.js"
compatibility_date = "2024-01-01"

# workers.dev diblokir sebagian ISP Indonesia (TLS diputus di tengah handshake).
# Pakai domain sendiri supaya upload tetap jalan dari jaringan kantor.
routes = [
  { pattern = "upload.prasastigroup.id", custom_domain = true }
]

# Penyimpanan sekarang S3 (Onidel, S3-compatible), bukan R2.
# Bucket lama R2 tetap hidup lewat domain files.prasastigroup.id supaya lampiran
# lama masih bisa dibuka. Worker ini hanya menangani file baru.
[vars]
S3_ENDPOINT = "https://s3.ap-southeast-1.onidel.cloud"
S3_REGION = "ap-southeast-1"
S3_BUCKET = "finance"
S3_PUBLIC_URL = "https://s3.ap-southeast-1.onidel.cloud/finance"

# Secret (set dengan `wrangler secret put`, jangan ditulis di file ini):
#   S3_ACCESS_KEY_ID
#   S3_SECRET_ACCESS_KEY
#   DELETE_SECRET   (opsional; bila diset, DELETE wajib header X-Delete-Key)
